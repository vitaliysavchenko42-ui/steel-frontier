<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Стальной Рубеж — танковая аркада</title>
<meta name="description" content="Браузерная танковая аркада с бесконечными уровнями. Собственный код и графика.">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<div id="stage">
  <canvas id="game" width="448" height="496"></canvas>
  <div id="touch" aria-hidden="true">
    <div id="dpad">
      <button class="tbtn" data-key="ArrowUp"    style="grid-area: u">▲</button>
      <button class="tbtn" data-key="ArrowLeft"  style="grid-area: l">◀</button>
      <button class="tbtn" data-key="ArrowRight" style="grid-area: r">▶</button>
      <button class="tbtn" data-key="ArrowDown"  style="grid-area: d">▼</button>
    </div>
    <button id="fire" class="tbtn" data-key="Space">ОГОНЬ</button>
  </div>
  <p id="hint">Стрелки/WASD — движение · ПРОБЕЛ — огонь · P — пауза</p>
</div>
<script src="js/bundle.js?v=17"></script>
<script src="js/bundle2.js?v=17"></script>
<script src="js/bundle3.js?v=17"></script>
<script src="js/bundle3b.js?v=17"></script>
</body>
</html>
